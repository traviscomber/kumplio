name: Temporary export master assets

on:
  push:
    branches:
      - agent/en-master-assets-v3

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: kumplio-master-assets
          path: |
            public/brand/kumplio-master-hero.jpg
            public/brand/kumplio-master-how.jpg
            public/brand/kumplio-master-paths.jpg
