name: Diagnose failed Vercel previews

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vercel-preview-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '123'
    steps:
      - name: Collect Vercel deployment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get('VERCEL_TOKEN', '').strip()
          deployments = [
              {
                  'label': 'Kumplio',
                  'id': '4Uo1GDDK3pjPbQSUJadRXqFbd24F',
                  'team_id': 'team_VvIPBATpeoA0eQw8fIx4rhan',
              },
              {
                  'label': 'v0-normative-compliance-analysis',
                  'id': '8PFA1pWJ59DHg3K5ShDQd4L55X9F',
                  'team_id': 'team_T9u1mifn68sCOcUK9HbvDdGk',
              },
          ]

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/json',
                      'User-Agent': 'kumplio-vercel-diagnostics',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, json.loads(response.read().decode('utf-8', errors='replace'))

          def safe_request(base_url, team_id):
              candidates = [
                  f'{base_url}?teamId={urllib.parse.quote(team_id)}',
                  base_url,
              ]
              errors = []
              for url in candidates:
                  try:
                      return request_json(url)
                  except urllib.error.HTTPError as error:
                      body = error.read().decode('utf-8', errors='replace')[:800]
                      errors.append(f'HTTP {error.code}: {body}')
                  except Exception as error:
                      errors.append(f'{type(error).__name__}: {error}')
              raise RuntimeError(' | '.join(errors))

          def collect_strings(value, path='root'):
              output = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      output.extend(collect_strings(item, f'{path}.{key}'))
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      output.extend(collect_strings(item, f'{path}[{index}]'))
              elif isinstance(value, str):
                  output.append((path, value))
              return output

          def clean_line(text):
              text = re.sub(r'\x1b\[[0-9;]*m', '', text)
              text = text.replace(token, '[REDACTED]') if token else text
              text = re.sub(r'(?i)(authorization|token|secret|password)=?\s*[^\s]+', r'\1=[REDACTED]', text)
              return text.strip()

          def event_lines(events):
              keywords = re.compile(
                  r'(?i)(error|failed|failure|npm err|eresolve|engine|lockfile|packageManager|cannot find|module not found|typescript|type error|build command|install command|exited with|ELIFECYCLE|unsupported)'
              )
              all_lines = []
              for path, value in collect_strings(events):
                  for raw_line in value.splitlines():
                      line = clean_line(raw_line)
                      if line:
                          all_lines.append((path, line))
              matched = [(path, line) for path, line in all_lines if keywords.search(line)]
              selected = matched[-120:] if matched else all_lines[-80:]
              unique = []
              seen = set()
              for path, line in selected:
                  key = (path, line)
                  if key not in seen:
                      seen.add(key)
                      unique.append((path, line))
              return unique

          report = [
              '## Diagnóstico automático de previews Vercel',
              '',
              f'Ejecutado: {datetime.now(timezone.utc).isoformat()}',
              '',
          ]

          if not token:
              report.extend([
                  'No fue posible consultar Vercel: GitHub no tiene configurado `VERCEL_TOKEN` ni `VERCEL_ACCESS_TOKEN`.',
                  '',
                  'No se imprimió ningún secreto.',
              ])
          else:
              for deployment in deployments:
                  report.extend([f"### {deployment['label']}", ''])
                  deployment_id = deployment['id']
                  team_id = deployment['team_id']

                  try:
                      _, metadata = safe_request(
                          f'https://api.vercel.com/v13/deployments/{deployment_id}',
                          team_id,
                      )
                      fields = [
                          'uid', 'name', 'url', 'state', 'readyState', 'errorCode',
                          'errorMessage', 'errorStep', 'buildErrorAt', 'createdAt',
                          'buildingAt', 'ready', 'target', 'nodeVersion',
                      ]
                      summary = {key: metadata.get(key) for key in fields if metadata.get(key) is not None}
                      report.extend(['**Metadata**', '', '```json', json.dumps(summary, ensure_ascii=False, indent=2)[:6000], '```', ''])
                  except Exception as error:
                      report.extend([f'Metadata no disponible: `{clean_line(str(error))[:1200]}`', ''])

                  try:
                      _, events = safe_request(
                          f'https://api.vercel.com/v3/deployments/{deployment_id}/events&builds=1&limit=1000&direction=backward'.replace('/events&', '/events?'),
                          team_id,
                      )
                      lines = event_lines(events)
                      report.extend(['**Líneas relevantes de build**', '', '```text'])
                      if lines:
                          report.extend([f'{path}: {line}'[:1200] for path, line in lines])
                      else:
                          report.append('No se encontraron líneas de texto en los eventos.')
                      report.extend(['```', ''])
                  except Exception as error:
                      report.extend([f'Eventos no disponibles: `{clean_line(str(error))[:1200]}`', ''])

          body = '\n'.join(report)
          if len(body) > 60000:
              body = body[:59500] + '\n\n_Reporte truncado automáticamente._'
          with open('/tmp/vercel-diagnostics.md', 'w', encoding='utf-8') as handle:
              handle.write(body)
          PY

      - name: Publish diagnostics on PR 123
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          body = Path('/tmp/vercel-diagnostics.md').read_text(encoding='utf-8')
          Path('/tmp/comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --data-binary @/tmp/comment.json
