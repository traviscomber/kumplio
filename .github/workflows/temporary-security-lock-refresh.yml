name: Temporary security lock refresh

on:
  push:
    branches:
      - agent/align-discovery-positioning

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/align-discovery-positioning

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched framework dependencies
        run: |
          npm install --save-exact next@16.3.5
          npm install --save-dev --save-exact eslint-config-next@16.3.5
          npm audit fix --package-lock-only || true

      - name: Verify reproducible install and critical audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=critical

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix(security): refresh patched framework dependencies"
            git push origin HEAD:agent/align-discovery-positioning
          fi
