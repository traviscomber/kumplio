name: Temporary shared how layout

on:
  push:
    branches:
      - agent/shared-how-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-how-layout
          fetch-depth: 0
      - run: python scripts/temp-shared-how.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix(public): share How layout across ES and EN"
          git push origin HEAD:agent/shared-how-layout
