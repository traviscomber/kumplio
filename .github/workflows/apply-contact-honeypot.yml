name: Apply contact honeypot

on:
  push:
    branches:
      - agent/lead-persistence-001
    paths:
      - .github/workflows/apply-contact-honeypot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/lead-persistence-001

      - name: Update contact form
        run: node scripts/apply-contact-honeypot.mjs

      - name: Commit honeypot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-contact-honeypot.yml scripts/apply-contact-honeypot.mjs
          git add app/contact/page.tsx
          git commit -m "Agrega campo señuelo al formulario de contacto"
          git push origin HEAD:agent/lead-persistence-001
