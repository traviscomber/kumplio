name: Diagnose Vercel deployment

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'lib/services/export.ts'
      - 'app/api/export/route.ts'
      - '.github/workflows/diagnose-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-install-build:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install like Vercel
        run: npm install

      - name: Validate security gates
        run: |
          npm run check:discovery
          npm run check:boundaries
          npm run check:auth
          npm run check:export

      - name: Build Next.js
        run: npm run build

      - name: Inspect export dependencies and server output
        shell: bash
        run: |
          set -euo pipefail
          echo '===== PACKAGE SIZES ====='
          du -sh node_modules/exceljs node_modules/jspdf node_modules/html2canvas 2>/dev/null || true
          echo '===== EXPORT SERVER FILES ====='
          find .next/server -path '*api*export*' -type f -print -exec du -h {} \; || true
          echo '===== LARGEST SERVER FILES ====='
          find .next/server -type f -printf '%s %p\n' | sort -nr | head -30 | numfmt --field=1 --to=iec || true
