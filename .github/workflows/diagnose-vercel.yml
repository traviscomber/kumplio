name: Diagnose Vercel deployment

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'lib/services/export.ts'
      - 'app/api/export/route.ts'
      - '.github/workflows/diagnose-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-vercel-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is not configured in GitHub Actions.'
            exit 1
          fi

      - name: Inspect failed Kumplio deployment logs
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest inspect GuM6xkoic4w8emuyzwGmUzstNmtw --logs \
            --scope team_VvIPBATpeoA0eQw8fIx4rhan \
            --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/kumplio-deployment.log

      - name: Inspect failed v0 deployment logs
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest inspect 4HaQxKssqkVwoUwMrXmZGGeNW8w4 --logs \
            --scope team_T9u1mifn68sCOcUK9HbvDdGk \
            --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/v0-deployment.log

      - name: Pull exact Kumplio preview settings
        if: always()
        shell: bash
        env:
          VERCEL_ORG_ID: team_VvIPBATpeoA0eQw8fIx4rhan
          VERCEL_PROJECT_ID: prj_wrTFzldPtqMjFGItE1Bd6BoeZztm
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build with exact Kumplio preview settings
        if: always()
        shell: bash
        env:
          VERCEL_ORG_ID: team_VvIPBATpeoA0eQw8fIx4rhan
          VERCEL_PROJECT_ID: prj_wrTFzldPtqMjFGItE1Bd6BoeZztm
        run: |
          set -o pipefail
          npx --yes vercel@latest build --yes --debug --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/kumplio-vercel-build.log

      - name: Pull exact v0 preview settings
        if: always()
        shell: bash
        env:
          VERCEL_ORG_ID: team_T9u1mifn68sCOcUK9HbvDdGk
          VERCEL_PROJECT_ID: prj_rqkB0DbDafZE6jQfQq4YofUeHyTm
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build with exact v0 preview settings
        if: always()
        shell: bash
        env:
          VERCEL_ORG_ID: team_T9u1mifn68sCOcUK9HbvDdGk
          VERCEL_PROJECT_ID: prj_rqkB0DbDafZE6jQfQq4YofUeHyTm
        run: |
          set -o pipefail
          npx --yes vercel@latest build --yes --debug --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/v0-vercel-build.log

      - name: Summarize diagnostic logs
        if: always()
        shell: bash
        run: |
          for file in /tmp/kumplio-deployment.log /tmp/v0-deployment.log /tmp/kumplio-vercel-build.log /tmp/v0-vercel-build.log; do
            echo "===== $file ====="
            tail -250 "$file" 2>/dev/null || true
          done

# Segunda publicación para activar el diagnóstico autenticado.
