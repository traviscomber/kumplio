name: Apply product UX changes

on:
  push:
    branches:
      - agent/product-ux-002
    paths:
      - .github/workflows/apply-product-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-ux-002

      - name: Unify onboarding and analytics navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('app/dashboard/content.tsx')
          text = dashboard.read_text()
          text = text.replace("import { OnboardingFlow } from '@/components/onboarding/onboarding-flow'\n", '')
          text = text.replace("  const [showOnboarding, setShowOnboarding] = useState(false)\n", '')
          old_membership = '''        if (!membership?.organization_id) {
          const { data: documents } = await supabase.from('documents').select('id').eq('user_id', auth.user.id).limit(1)
          setShowOnboarding(!documents?.length)
          if (documents?.length) setWarning('Tu cuenta todavía no está vinculada a una organización.')
          return
        }
'''
          new_membership = '''        if (!membership?.organization_id) {
          window.location.href = '/onboarding'
          return
        }
'''
          if old_membership not in text:
              raise SystemExit('Dashboard membership block not found')
          text = text.replace(old_membership, new_membership, 1)
          old_onboarding = '''  if (showOnboarding) {
    return (
      <div className="space-y-8">
        <div>
          <p className="text-sm font-semibold text-primary">Comienza con contexto real</p>
          <h1 className="mt-2 text-3xl font-bold">Prepara tu primera misión</h1>
          <p className="mt-2 max-w-2xl text-muted-foreground">
            Carga una fuente regulatoria, contrato o política para que Kumplio comprenda tu organización.
          </p>
        </div>
        <OnboardingFlow onComplete={() => (window.location.href = '/dashboard')} />
      </div>
    )
  }

'''
          if old_onboarding not in text:
              raise SystemExit('Dashboard alternate onboarding block not found')
          text = text.replace(old_onboarding, '', 1)
          dashboard.write_text(text)

          analytics = Path('app/analytics/client.tsx')
          text = analytics.read_text()
          text = text.replace("import { TopNav } from '@/components/layout/top-nav';", "import { WorkspaceNav } from '@/components/workspace-nav';")
          text = text.replace('<TopNav />', '<WorkspaceNav />')
          text = text.replace('<h1 className="text-3xl font-bold mb-2">Analytics</h1>', '<h1 className="text-3xl font-bold mb-2">Análisis</h1>')
          text = text.replace('Dashboard de cumplimiento y análisis de riesgos', 'Indicadores de cumplimiento, riesgos y desempeño operativo')
          analytics.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-product-ux.yml
          git add app/dashboard/content.tsx app/analytics/client.tsx
          git commit -m "Unifica onboarding y navegación de análisis"
          git push origin HEAD:agent/product-ux-002

# Segunda publicación para activar el workflow ya registrado en la rama.
