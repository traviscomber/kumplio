name: Apply product UX changes

on:
  push:
    branches:
      - agent/product-ux-002
    paths:
      - .github/workflows/apply-product-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-ux-002

      - name: Apply verified UX transformation
        run: node scripts/apply-product-ux.mjs

      - name: Commit transformed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-product-ux.yml scripts/apply-product-ux.mjs
          git add app/dashboard/content.tsx app/analytics/client.tsx
          git commit -m "Unifica onboarding y navegación de análisis"
          git push origin HEAD:agent/product-ux-002
