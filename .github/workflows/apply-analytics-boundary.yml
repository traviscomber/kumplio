name: Apply analytics client boundary

on:
  push:
    branches:
      - agent/analytics-security-001
    paths:
      - .github/workflows/apply-analytics-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analytics-security-001

      - name: Update analytics client
        run: node scripts/apply-analytics-boundary.mjs

      - name: Commit client-safe analytics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-analytics-boundary.yml scripts/apply-analytics-boundary.mjs
          git add app/analytics/client.tsx
          git commit -m "Conecta Analytics al cliente autenticado con RLS"
          git push origin HEAD:agent/analytics-security-001
