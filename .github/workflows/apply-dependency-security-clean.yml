name: Apply clean dependency security graph

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'lib/services/export.ts'
      - 'app/api/export/route.ts'
      - 'scripts/check-excel-export.mjs'
      - '.github/workflows/apply-dependency-security-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm install

      - name: Validate application and export runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run check:discovery
          npm run check:boundaries
          npm run check:auth
          npm run check:export
          npm run typecheck
          npm run build

      - name: Require zero vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit-clean.json || true
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-clean.json', 'utf8'))
          const totals = report.metadata?.vulnerabilities || {}
          console.log('AUDIT_CLEAN_TOTALS', JSON.stringify(totals))
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: vulnerability.severity,
              direct: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
            }))
          }
          if ((totals.total || 0) !== 0) process.exit(1)
          NODE

      - name: Commit clean lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dependency-security-clean.yml
          git add package.json package-lock.json
          git commit -m "Regenera lockfile auditado sobre main"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
