name: Apply dependency security updates

on:
  push:
    branches:
      - agent/dependency-security-001
    paths:
      - .github/workflows/apply-dependency-updates.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-001

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compatible direct dependency updates
        shell: bash
        run: |
          set -euo pipefail

          npm pkg set name='kumplio'
          npm pkg delete dependencies.xlsx
          npm pkg set dependencies.@ai-sdk/react='^3.0.203'
          npm pkg set dependencies.@supabase/ssr='^0.10.4'
          npm pkg set dependencies.@supabase/supabase-js='^2.108.0'
          npm pkg set dependencies.ai='^6.0.203'
          npm pkg set dependencies.axios='^1.18.0'
          npm pkg set dependencies.next='16.3.0'
          npm pkg set dependencies.openai='^6.43.0'
          npm pkg set dependencies.swr='^2.4.2'
          npm pkg set dependencies.zod='^4.4.8'
          npm pkg set devDependencies.postcss='^8.5.8'
          npm pkg set devDependencies.tailwindcss='^4.2.2'

          npm install
          npm update

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          npm run check:discovery
          npm run check:boundaries
          npm run check:auth
          npm run build

      - name: Report remaining vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit-after.json || true
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-after.json', 'utf8'))
          console.log('AUDIT_AFTER_TOTALS', JSON.stringify(report.metadata?.vulnerabilities || {}))
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: vulnerability.severity,
              direct: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
              via: (vulnerability.via || []).map((item) => typeof item === 'string' ? item : `${item.source}:${item.title}`),
            }))
          }
          NODE

      - name: Commit updated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dependency-updates.yml
          git add package.json package-lock.json
          git commit -m "Actualiza dependencias vulnerables compatibles"
          git push origin HEAD:agent/dependency-security-001
