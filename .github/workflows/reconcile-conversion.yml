name: Reconcile conversion branch

on:
  push:
    branches:
      - agent/conversion-auth-002
    paths:
      - .github/workflows/reconcile-conversion.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/conversion-auth-002
          fetch-depth: 0

      - name: Apply conversion delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/conversion-auth-001
          mapfile -t files < <(git diff --name-only 09e027172e7d7b020e9ff21f74f0a9b0947509ec origin/agent/conversion-auth-001)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No conversion delta found"
            exit 1
          fi
          git checkout origin/agent/conversion-auth-001 -- "${files[@]}"
          git rm .github/workflows/reconcile-conversion.yml
          git add -A
          git commit -m "Reconcilia conversión y autenticación sobre main"
          git push origin HEAD:agent/conversion-auth-002
