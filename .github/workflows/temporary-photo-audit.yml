name: Temporary photo parity audit

on:
  push:
    branches:
      - agent/en-exact-photo-parity

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source imagery
        run: |
          file public/brand/kumplio-master-hero.jpg public/brand/kumplio-hero-compliance.webp
          file public/brand/kumplio-master-how.jpg public/brand/kumplio-operating-model.webp
          file public/brand/kumplio-master-paths.jpg public/brand/kumplio-specialists.webp
      - name: Create contact sheet
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          pairs = [
              ('master hero', 'public/brand/kumplio-master-hero.jpg'),
              ('EN current hero', 'public/brand/kumplio-hero-compliance.webp'),
              ('master how', 'public/brand/kumplio-master-how.jpg'),
              ('EN current how', 'public/brand/kumplio-operating-model.webp'),
              ('master paths', 'public/brand/kumplio-master-paths.jpg'),
              ('EN current paths', 'public/brand/kumplio-specialists.webp'),
          ]
          W, H = 800, 360
          cards = []
          for label, path in pairs:
              im = Image.open(path).convert('RGB')
              fitted = ImageOps.contain(im, (W, H-40))
              card = Image.new('RGB', (W, H), (20,20,20))
              card.paste(fitted, ((W-fitted.width)//2, 34 + (H-40-fitted.height)//2))
              d = ImageDraw.Draw(card)
              d.text((12,10), f'{label} — {im.width}x{im.height}', fill=(240,240,240))
              cards.append(card)
          sheet = Image.new('RGB', (W*2, H*3), (0,0,0))
          for i, card in enumerate(cards):
              sheet.paste(card, ((i%2)*W, (i//2)*H))
          out = Path('photo-audit-contact-sheet.jpg')
          sheet.save(out, quality=92)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: photo-audit-contact-sheet
          path: photo-audit-contact-sheet.jpg
