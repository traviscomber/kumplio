name: Public discovery validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/chile-compliance-content.ts'
      - 'lib/public-site.ts'
      - 'lib/services/**'
      - 'scripts/check-public-discovery.mjs'
      - 'scripts/check-client-boundaries.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/public-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public discovery surface
        run: npm run check:discovery

      - name: Validate client-server boundaries
        run: npm run check:boundaries

      - name: Build Next.js
        run: npm run build
