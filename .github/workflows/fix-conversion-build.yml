name: Fix conversion build

on:
  push:
    branches:
      - agent/conversion-auth-002
    paths:
      - .github/workflows/fix-conversion-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/conversion-auth-002

      - name: Add Suspense boundary to contact page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/contact/page.tsx')
          text = path.read_text()
          text = text.replace(
              "import { ChangeEvent, FormEvent, useState } from 'react'",
              "import { ChangeEvent, FormEvent, Suspense, useState } from 'react'",
              1,
          )
          text = text.replace(
              'export default function ContactPage() {\n  const searchParams',
              'function ContactContent() {\n  const searchParams',
              1,
          )
          marker = '\nfunction Field({ label, children }: { label: string; children: React.ReactNode }) {'
          wrapper = '''\nexport default function ContactPage() {\n  return (\n    <Suspense fallback={<main className="min-h-screen bg-background" />}>\n      <ContactContent />\n    </Suspense>\n  )\n}\n'''
          if marker not in text:
              raise SystemExit('Field marker not found')
          text = text.replace(marker, wrapper + marker, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-conversion-build.yml
          git add app/contact/page.tsx
          git commit -m "Corrige prerender de Contacto con Suspense"
          git push origin HEAD:agent/conversion-auth-002
