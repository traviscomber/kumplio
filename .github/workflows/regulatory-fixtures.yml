name: Regulatory fixtures

on:
  pull_request:
    paths:
      - 'lib/regulatory/**'
      - 'data/regulatory/fixtures/**'
      - 'scripts/check-leychile-fixtures.mjs'
      - '.github/workflows/regulatory-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leychile-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and diff synthetic LeyChile fixtures
        run: node scripts/check-leychile-fixtures.mjs
