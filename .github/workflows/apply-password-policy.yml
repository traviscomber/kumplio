name: Apply password policy

on:
  push:
    branches:
      - agent/auth-password-policy-001
    paths:
      - .github/workflows/apply-password-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-password-policy-001

      - name: Apply central password policy
        run: node scripts/apply-password-policy.mjs

      - name: Commit authentication changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-password-policy.yml scripts/apply-password-policy.mjs
          git add 'app/(auth)/sign-up/page.tsx' 'app/(auth)/update-password/page.tsx' 'app/(auth)/sign-in/page.tsx'
          git commit -m "Aplica política fuerte a registro y recuperación"
          git push origin HEAD:agent/auth-password-policy-001
