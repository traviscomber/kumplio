name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'supabase/migrations/**'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://kumplio.app
      INDEXNOW_KEY: 5f3a9c7d2e4b6810a9d5f4c2b7e8a163
      STATUS_CONTEXT: IndexNow production
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark IndexNow notification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              'state': 'pending',
              'context': os.environ['STATUS_CONTEXT'],
              'description': 'Waiting for the Kumplio production deployment',
              'target_url': os.environ['STATUS_TARGET'],
          }))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment and key verification
        shell: bash
        run: |
          set -euo pipefail
          key_url="$SITE_URL/$INDEXNOW_KEY.txt"

          for attempt in $(seq 1 60); do
            body=$(curl -fsSL --max-time 15 "$key_url" 2>/dev/null || true)
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              echo "IndexNow key is available in production."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/60)..."
            sleep 10
          done

          echo "The IndexNow key was not available after 10 minutes."
          exit 1

      - name: Build URL payload from production sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          site_url = os.environ['SITE_URL'].rstrip('/')
          key = os.environ['INDEXNOW_KEY']
          expected_origin = f"{urlparse(site_url).scheme}://{urlparse(site_url).netloc}"

          root = ET.parse('/tmp/sitemap.xml').getroot()
          namespace = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = {node.text.strip() for node in root.findall('.//s:loc', namespace) if node.text}
          urls.update({
              f'{site_url}/sales-kit',
              f'{site_url}/demo/transporte',
              f'{site_url}/demo/mineria',
          })

          valid_urls = sorted(
              url for url in urls
              if f"{urlparse(url).scheme}://{urlparse(url).netloc}" == expected_origin
              and urlparse(url).scheme == 'https'
          )

          if not valid_urls:
              raise SystemExit('No valid Kumplio URLs found in sitemap')
          if len(valid_urls) > 10000:
              raise SystemExit('IndexNow payload exceeds 10,000 URLs')

          payload = {
              'host': urlparse(site_url).netloc,
              'key': key,
              'keyLocation': f'{site_url}/{key}.txt',
              'urlList': valid_urls,
          }

          with open('/tmp/indexnow.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)

          print(f'Prepared {len(valid_urls)} URLs for IndexNow.')
          PY

      - name: Submit URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 5); do
            status=$(curl -sS --max-time 30 \
              -o /tmp/indexnow-response.txt \
              -w '%{http_code}' \
              -X POST 'https://api.indexnow.org/indexnow' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json || true)

            if [ "$status" = '200' ] || [ "$status" = '202' ]; then
              echo "IndexNow accepted the submission with HTTP $status."
              exit 0
            fi

            if [ "$status" = '429' ] || [[ "$status" =~ ^5 ]]; then
              echo "Temporary IndexNow response HTTP $status; retrying ($attempt/5)."
              sleep $((attempt * 15))
              continue
            fi

            echo "IndexNow rejected the submission with HTTP $status."
            cat /tmp/indexnow-response.txt || true
            exit 1
          done

          echo 'IndexNow did not accept the submission after retries.'
          exit 1

      - name: Mark IndexNow notification successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              'state': 'success',
              'context': os.environ['STATUS_CONTEXT'],
              'description': 'IndexNow accepted the Kumplio production URLs',
              'target_url': os.environ['STATUS_TARGET'],
          }))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Mark IndexNow notification failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              'state': 'failure',
              'context': os.environ['STATUS_CONTEXT'],
              'description': 'IndexNow production notification failed',
              'target_url': os.environ['STATUS_TARGET'],
          }))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
