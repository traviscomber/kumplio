name: Finalize dependency security

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-excel-export.mjs'
      - 'lib/services/export.ts'
      - 'app/api/export/route.ts'
      - '.github/workflows/finalize-dependency-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current graph
        run: npm ci

      - name: Resolve latest patched versions within current major lines
        shell: bash
        run: |
          set -euo pipefail

          latest_version() {
            node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const value = JSON.parse(input); console.log(Array.isArray(value) ? value.at(-1) : value); });"
          }

          AI_VERSION=$(npm view ai@6 version --json | latest_version)
          REACT_VERSION=$(npm view @ai-sdk/react@3 version --json | latest_version)
          UNDICI6_VERSION=$(npm view undici@6 version --json | latest_version)

          echo "Using ai@$AI_VERSION"
          echo "Using @ai-sdk/react@$REACT_VERSION"
          echo "Using undici@$UNDICI6_VERSION for transitive consumers"

          npm pkg set dependencies.ai="$AI_VERSION"
          npm pkg set dependencies.@ai-sdk/react="$REACT_VERSION"
          npm pkg set 'overrides.exceljs.uuid=^11.1.1'
          npm pkg set overrides.undici="$UNDICI6_VERSION"
          npm install
          npm audit fix || true

      - name: Validate application and Excel runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run check:discovery
          npm run check:boundaries
          npm run check:auth
          npm run check:export
          npm run build

      - name: Require zero high or critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit-final.json || true
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-final.json', 'utf8'))
          const totals = report.metadata?.vulnerabilities || {}
          console.log('AUDIT_FINAL_TOTALS', JSON.stringify(totals))

          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: vulnerability.severity,
              direct: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
              via: (vulnerability.via || []).map((item) => typeof item === 'string' ? item : `${item.source}:${item.title}`),
            }))
          }

          if ((totals.critical || 0) > 0 || (totals.high || 0) > 0) {
            console.error('High or critical vulnerabilities remain after compatible fixes.')
            process.exit(1)
          }
          NODE

      - name: Commit finalized dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-dependency-security.yml
          git add package.json package-lock.json
          git commit -m "Finaliza correcciones compatibles de dependencias"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
