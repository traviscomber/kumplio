name: Reconcile GEO branch

on:
  push:
    branches:
      - agent/geo-seo-llmo-chile-002
    paths:
      - .github/workflows/reconcile-geo.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/geo-seo-llmo-chile-002
          fetch-depth: 0

      - name: Apply validated GEO delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/public-surface-hardening-001 agent/geo-seo-llmo-chile-001
          mapfile -t files < <(git diff --name-only origin/agent/public-surface-hardening-001 origin/agent/geo-seo-llmo-chile-001)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No GEO delta found"
            exit 1
          fi
          git checkout origin/agent/geo-seo-llmo-chile-001 -- "${files[@]}"
          git rm .github/workflows/reconcile-geo.yml
          git add -A
          git commit -m "Reconcilia GEO SEO y LLMO sobre main"
          git push origin HEAD:agent/geo-seo-llmo-chile-002
