name: Temporary pnpm lock refresh

on:
  push:
    branches:
      - agent/align-discovery-positioning

permissions:
  contents: write

jobs:
  refresh-pnpm-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/align-discovery-positioning

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install and critical audit
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level critical

      - name: Commit generated pnpm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No pnpm lock changes to commit."
          else
            git commit -m "fix(build): refresh pnpm lock for patched framework"
            git push origin HEAD:agent/align-discovery-positioning
          fi
