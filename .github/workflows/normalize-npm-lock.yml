name: Normalize npm lockfile for Vercel

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/normalize-npm-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile with supported npm 10
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npx --yes npm@10.9.4 install --package-lock-only
          npx --yes npm@10.9.4 ci

      - name: Verify lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const root = lock.packages?.[''] || {}

          console.log('MANIFEST_ENGINES', JSON.stringify(manifest.engines || {}))
          console.log('LOCK_ENGINES', JSON.stringify(root.engines || {}))

          if (root.engines?.npm) {
            throw new Error(`Lockfile still pins npm: ${root.engines.npm}`)
          }
          if (root.engines?.node !== manifest.engines?.node) {
            throw new Error('Lockfile Node engine does not match package.json')
          }
          if (lock.lockfileVersion !== 3) {
            throw new Error(`Unexpected lockfileVersion: ${lock.lockfileVersion}`)
          }
          NODE

      - name: Validate application with npm 10
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm@10.9.4 run check:discovery
          npx --yes npm@10.9.4 run check:boundaries
          npx --yes npm@10.9.4 run check:auth
          npx --yes npm@10.9.4 run check:export
          npx --yes npm@10.9.4 run typecheck
          npx --yes npm@10.9.4 run build

      - name: Require zero vulnerabilities with npm 10
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm@10.9.4 audit --json > /tmp/npm-audit-vercel.json || true
          node - <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-vercel.json', 'utf8'))
          const totals = report.metadata?.vulnerabilities || {}
          console.log('AUDIT_VERCEL_TOTALS', JSON.stringify(totals))
          if ((totals.total || 0) !== 0) process.exit(1)
          NODE

      - name: Commit normalized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-npm-lock.yml
          git add package-lock.json
          git commit -m "Normaliza lockfile para npm 10 en Vercel"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
