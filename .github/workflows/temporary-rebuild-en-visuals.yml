name: Temporary rebuild EN visuals

on:
  push:
    branches:
      - agent/en-master-assets-v3

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/en-master-assets-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate clean assets from canonical ES masters
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          brand = Path('public/brand')
          derived = {
              'kumplio-hero-photo.webp': ('kumplio-master-hero.jpg', (680, 0, 1600, 611)),
              'kumplio-path-worker.webp': ('kumplio-master-paths.jpg', (0, 60, 385, 840)),
              'kumplio-path-company.webp': ('kumplio-master-paths.jpg', (1320, 60, 1600, 840)),
              'kumplio-how-understand.webp': ('kumplio-master-how.jpg', (95, 445, 265, 620)),
              'kumplio-how-resolve.webp': ('kumplio-master-how.jpg', (655, 445, 820, 620)),
              'kumplio-how-demonstrate.webp': ('kumplio-master-how.jpg', (1160, 445, 1335, 620)),
          }
          for out, (src, box) in derived.items():
              im = Image.open(brand / src).convert('RGB').crop(box)
              im.save(brand / out, 'WEBP', quality=94, method=6)
              print(out, im.size)
          PY
      - name: Replace patched EN masters with clean localized composition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          text = p.read_text()

          # Hero desktop EN
          start = text.index('          {locale === \'en\' && <div className="relative mx-auto hidden aspect-[1600/611]')
          end = text.index('          <div className={`relative min-h-[740px] overflow-hidden lg:hidden`}>', start)
          hero = '''          {locale === 'en' && <div className="relative mx-auto hidden aspect-[1600/611] w-full max-w-[1920px] overflow-hidden bg-[#10110F] lg:grid lg:grid-cols-[43%_57%]">
            <div className="relative z-10 flex flex-col justify-center px-[11%] py-10">
              <h1 className="text-[clamp(40px,3.7vw,70px)] font-light leading-[1.02] tracking-[-.045em] text-[#C2A887]">Stay compliant.<br /><span className="text-[#B17A4D]">Without chasing documents.</span></h1>
              <p className="mt-[5%] max-w-[510px] text-[clamp(13px,1.05vw,18px)] leading-[1.55] text-[#C8C3B8]">{c.heroSupport}</p>
              <div className="mt-[7%] grid max-w-[550px] grid-cols-2 gap-8">
                <div><a href="/sign-up?audience=person" className="inline-flex min-h-12 w-full items-center justify-between rounded-[4px] bg-[#A7C63A] px-6 text-sm font-medium text-[#171715]">{c.workerPath}<ArrowRight className="h-4 w-4" /></a><p className="mt-4 text-sm leading-6 text-[#AAA69C]">Your documents ready for work.</p></div>
                <div className="border-l border-[#5A5045] pl-8"><a href="/sign-up?audience=company" className="inline-flex min-h-12 w-full items-center justify-between rounded-[4px] border border-[#747169] px-6 text-sm font-medium text-[#C2A887]">{c.companyPath}<ArrowRight className="h-4 w-4" /></a><p className="mt-4 text-sm leading-6 text-[#AAA69C]">Control your team’s compliance.</p></div>
              </div>
            </div>
            <div className="relative min-h-full overflow-hidden">
              <Image src="/brand/kumplio-hero-photo.webp" alt="" fill priority sizes="57vw" className="object-cover object-center" />
              <span className="absolute inset-0 bg-[linear-gradient(90deg,#10110F_0%,rgba(16,17,15,.58)_10%,rgba(16,17,15,.10)_26%,rgba(16,17,15,0)_48%)]" />
            </div>
          </div>}
'''
          text = text[:start] + hero + text[end:]

          # How desktop EN
          section = text.index('<section id="como-funciona"')
          start = text.index('          {locale === \'en\' && <div className="relative mx-auto hidden aspect-video', section)
          end = text.index('          <div className={`relative overflow-hidden ${sections} lg:hidden`}>', start)
          how = '''          {locale === 'en' && <div className="relative mx-auto hidden aspect-video w-full max-w-[1920px] overflow-hidden bg-[#10110F] lg:block">
            <div className="absolute left-[7.2%] top-[23%]">
              <h2 className="text-[clamp(42px,4vw,68px)] font-light leading-none tracking-[-.035em] text-[#C2A887]">How Kumplio <span className="text-[#B17A4D]">works.</span></h2>
              <p className="mt-5 text-[clamp(14px,1.15vw,20px)] text-[#C8C3B8]">From information to action, without friction.</p>
            </div>
            <div className="absolute inset-x-[4.5%] top-[44%] grid grid-cols-3">
              {[
                ['/brand/kumplio-how-understand.webp', '01', 'Understand', 'Kumplio identifies requirements, documents, gaps and changes.'],
                ['/brand/kumplio-how-resolve.webp', '02', 'Resolve', 'Prioritize what matters and organize what to do, who should do it and when.'],
                ['/brand/kumplio-how-demonstrate.webp', '03', 'Demonstrate', 'Preserve evidence, review and traceability for what was resolved.'],
              ].map(([src, number, title, body], index) => <article key={title} className={`relative min-h-[245px] px-7 ${index > 0 ? 'border-l border-[#393833]' : ''}`}>
                <span className="absolute -top-10 left-3 text-[clamp(44px,4vw,72px)] font-light text-[#292925]">{number}</span>
                <div className="relative grid grid-cols-[minmax(110px,36%)_1fr] items-center gap-6">
                  <div className="relative aspect-square w-full max-w-[175px]"><Image src={src} alt="" fill sizes="175px" className="object-contain" /></div>
                  <div><h3 className="text-[clamp(22px,1.7vw,32px)] font-light text-[#C2A887]">{title}</h3><span className="mt-4 block h-px w-12 bg-[#B17A4D]" /><p className="mt-5 max-w-[260px] text-[clamp(11px,.9vw,16px)] leading-[1.55] text-[#C8C3B8]">{body}</p></div>
                </div>
              </article>)}
            </div>
          </div>}
'''
          text = text[:start] + how + text[end:]

          # Paths desktop EN
          section = text.index('<span id="trabajador"', end)
          start = text.index('          {locale === \'en\' && <div className="relative mx-auto hidden aspect-video', section)
          end = text.index('          <div className={`relative overflow-hidden ${sections} lg:hidden`}>', start)
          paths = '''          {locale === 'en' && <div className="relative mx-auto hidden aspect-video w-full max-w-[1920px] overflow-hidden bg-[#10110F] lg:grid lg:grid-cols-[24%_52%_24%]">
            <div className="relative overflow-hidden"><Image src="/brand/kumplio-path-worker.webp" alt="" fill sizes="24vw" className="object-cover object-center" /><span className="absolute inset-0 bg-[linear-gradient(90deg,rgba(16,17,15,0)_55%,#10110F_100%)]" /></div>
            <div className="relative z-10 flex flex-col px-9 pt-[9%]">
              <div className="text-center"><h2 className="text-[clamp(40px,3.8vw,68px)] font-light leading-[1.02] tracking-[-.035em] text-[#C2A887]">Two paths.<br /><span className="text-[#B17A4D]">One shared outcome.</span></h2><p className="mt-4 text-[clamp(13px,1vw,18px)] text-[#AAA69C]">Choose how you want to work with Kumplio.</p></div>
              <div className="mt-[8%] grid grid-cols-2 text-left">
                <article className="border-r border-[#5A5045] pr-10"><p className="text-[10px] uppercase tracking-[.22em] text-[#B17A4D]">For workers</p><h3 className="mt-4 text-[clamp(24px,2vw,36px)] font-light leading-[1.08] text-[#C2A887]">{c.workerTitle}</h3><p className="mt-5 text-[clamp(11px,.82vw,15px)] leading-[1.6] text-[#C8C3B8]">{c.workerBody}</p><a href="/sign-up?audience=person" className="mt-7 inline-flex min-h-11 w-full items-center justify-between rounded-[4px] bg-[#A7C63A] px-6 text-sm font-medium text-[#171715]">{c.workerCta}<ArrowRight className="h-4 w-4" /></a></article>
                <article className="pl-10"><p className="text-[10px] uppercase tracking-[.22em] text-[#B17A4D]">For companies</p><h3 className="mt-4 text-[clamp(24px,2vw,36px)] font-light leading-[1.08] text-[#C2A887]">{c.companyTitle}</h3><p className="mt-5 text-[clamp(11px,.82vw,15px)] leading-[1.6] text-[#C8C3B8]">{c.companyBody}</p><a href="/sign-up?audience=company" className="mt-7 inline-flex min-h-11 w-full items-center justify-between rounded-[4px] bg-[#A7C63A] px-6 text-sm font-medium text-[#171715]">{c.companyCta}<ArrowRight className="h-4 w-4" /></a></article>
              </div>
            </div>
            <div className="relative overflow-hidden"><Image src="/brand/kumplio-path-company.webp" alt="" fill sizes="24vw" className="object-cover object-center" /><span className="absolute inset-0 bg-[linear-gradient(90deg,#10110F_0%,rgba(16,17,15,0)_45%)]" /></div>
          </div>}
'''
          text = text[:start] + paths + text[end:]
          p.write_text(text)
          PY
      - name: Validate generated source
        run: |
          test -f public/brand/kumplio-hero-photo.webp
          test -f public/brand/kumplio-path-worker.webp
          test -f public/brand/kumplio-path-company.webp
          test -f public/brand/kumplio-how-understand.webp
          test -f public/brand/kumplio-how-resolve.webp
          test -f public/brand/kumplio-how-demonstrate.webp
          grep -q 'kumplio-hero-photo.webp' app/page.tsx
          grep -q 'kumplio-how-demonstrate.webp' app/page.tsx
          grep -q 'kumplio-path-company.webp' app/page.tsx
      - name: Install and validate app
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit clean EN visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx public/brand/kumplio-hero-photo.webp public/brand/kumplio-path-worker.webp public/brand/kumplio-path-company.webp public/brand/kumplio-how-understand.webp public/brand/kumplio-how-resolve.webp public/brand/kumplio-how-demonstrate.webp
          git commit -m "fix(public): rebuild English home visuals cleanly"
          git push origin HEAD:agent/en-master-assets-v3
