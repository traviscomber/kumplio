name: Temporary rebuild EN visuals

on:
  push:
    branches:
      - agent/en-master-assets-v3

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/en-master-assets-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild clean English visuals
        run: |
          python -m pip install --quiet pillow
          python scripts/temp-rebuild-en-visuals.py
      - name: Validate app
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx public/brand/kumplio-*.webp
          git commit -m "fix(public): rebuild English home visuals cleanly"
          git push origin HEAD:agent/en-master-assets-v3
