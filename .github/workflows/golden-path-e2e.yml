name: Golden path Ley 21.719 E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/golden-path-e2e.yml'
      - 'app/api/internal/e2e/**'
      - 'lib/security/github-actions-oidc.ts'
      - 'app/api/agents/workflows/**'
      - 'app/api/agents/runs/**'
      - 'lib/agents/workflow-stage-executor.ts'
      - 'lib/agents/outcome-snapshot.ts'
      - 'supabase/migrations/20260916102000_durable_agent_workflow_outcome_snapshots.sql'
      - 'scripts/53-advance-workflow-after-approval.sql'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: golden-path-e2e-production
  cancel-in-progress: false

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_URL: https://www.kumplio.app
      CASE_ID: 91ae9174-be4c-4ddd-8980-4a671571afdc
      E2E_AUDIENCE: kumplio-golden-path-e2e
      E2E_MARKER: block02-golden-path
      STATUS_CONTEXT: Golden path E2E
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark golden path pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(STATE=pending DESCRIPTION='Golden path Ley 21.719 running' TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" CONTEXT="$STATUS_CONTEXT" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL,context:process.env.CONTEXT}))")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null

      - name: Wait for production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            verdict=$(PAYLOAD="$payload" node -e "const d=JSON.parse(process.env.PAYLOAD||'{}');const w=['Vercel – kumplio','Vercel – v0-normative-compliance-analysis'];const m=new Map();for(const s of d.statuses||[]){if(w.includes(s.context)&&!m.has(s.context))m.set(s.context,s.state)};process.stdout.write(w.every(n=>m.get(n)==='success')?'success':[...m.values()].some(s=>s==='failure'||s==='error')?'failure':'pending')")
            [[ "$verdict" == success ]] && { echo 'Production Vercel deployments are green.'; exit 0; }
            [[ "$verdict" == failure ]] && { echo 'A production Vercel deployment failed.' >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for production Vercel deployments.' >&2
          exit 1

      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${E2E_AUDIENCE}")
          OIDC_RESPONSE="$response" node -e "const p=JSON.parse(process.env.OIDC_RESPONSE||'{}');if(!p.value)process.exit(1);process.stdout.write(p.value)" > /tmp/kumplio-e2e-oidc
          chmod 600 /tmp/kumplio-e2e-oidc
          echo "::add-mask::$(cat /tmp/kumplio-e2e-oidc)"

      - name: Create temporary authenticated E2E session
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/kumplio-e2e-oidc)
          curl --fail --silent --show-error \
            --cookie-jar /tmp/kumplio-e2e-cookies \
            -H "Authorization: Bearer $token" \
            -H "X-Kumplio-E2E: $E2E_MARKER" \
            -H 'Content-Type: application/json' \
            --data "{\"caseId\":\"$CASE_ID\"}" \
            "$BASE_URL/api/internal/e2e/session" > /tmp/kumplio-e2e-session.json
          chmod 600 /tmp/kumplio-e2e-cookies
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/kumplio-e2e-session.json','utf8'));if(!p.ok||!p.serviceUserId)process.exit(1);console.log('Temporary E2E session created.')"

      - name: Create or resume isolated E2E workflow
        shell: bash
        run: |
          set -euo pipefail
          create_payload=$(CASE_ID="$CASE_ID" node -e "process.stdout.write(JSON.stringify({caseId:process.env.CASE_ID,workflowType:'compliance_assessment',instructions:'Golden Path E2E controlado para validar ejecución durable, revisión humana final y snapshot Outcome v2.'}))")
          http_code=$(curl --silent --show-error \
            --output /tmp/kumplio-workflow-create.json \
            --write-out '%{http_code}' \
            --cookie /tmp/kumplio-e2e-cookies \
            -H 'Content-Type: application/json' \
            --data "$create_payload" \
            "$BASE_URL/api/agents/workflows")
          if [[ "$http_code" != 200 && "$http_code" != 201 ]]; then
            echo "E2E workflow creation failed with HTTP $http_code:" >&2
            cat /tmp/kumplio-workflow-create.json >&2
            exit 1
          fi
          read -r WORKFLOW_ID TOTAL_STAGES < <(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/kumplio-workflow-create.json','utf8'));const w=p.workflow;if(!w?.id)throw new Error('E2E workflow id missing');if(w.status==='completed')throw new Error('E2E workflow must not reuse a completed fixture');const n=Number(w.total_stages);if(!Number.isInteger(n)||n<1)throw new Error('E2E workflow has invalid stage count');console.log(w.id+' '+n)")
          echo "WORKFLOW_ID=$WORKFLOW_ID" >> "$GITHUB_ENV"
          echo "TOTAL_STAGES=$TOTAL_STAGES" >> "$GITHUB_ENV"
          echo "E2E workflow selected: $WORKFLOW_ID with $TOTAL_STAGES stages."

      - name: Execute and approve durable specialist stages
        shell: bash
        run: |
          set -euo pipefail
          : "${WORKFLOW_ID:?WORKFLOW_ID not initialized}"
          : "${TOTAL_STAGES:?TOTAL_STAGES not initialized}"

          get_workflow() {
            curl --fail --silent --show-error \
              --cookie /tmp/kumplio-e2e-cookies \
              "$BASE_URL/api/agents/workflows/$WORKFLOW_ID" \
              > /tmp/kumplio-workflow.json
          }

          read_stage() {
            STAGE_INDEX="$1" FIELD="$2" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/kumplio-workflow.json','utf8'));const s=(p.stages||[]).find(x=>x.stage_index===Number(process.env.STAGE_INDEX));if(!s)process.exit(2);const v=s[process.env.FIELD];if(v!==null&&v!==undefined)process.stdout.write(String(v))"
          }

          for ((stage_index=0; stage_index<TOTAL_STAGES; stage_index++)); do
            get_workflow
            stage_status=$(read_stage "$stage_index" status)

            if [[ "$stage_status" == approved ]]; then
              echo "Stage $stage_index already approved."
              continue
            fi

            if [[ "$stage_status" != pending_review ]]; then
              body='{}'
              [[ "$stage_status" == changes_requested ]] && body='{"instructions":"Reintento E2E controlado: corrige únicamente las observaciones registradas y conserva trazabilidad."}'
              http_code=$(curl --silent --show-error \
                --output /tmp/kumplio-enqueue.json \
                --write-out '%{http_code}' \
                --cookie /tmp/kumplio-e2e-cookies \
                -H 'Content-Type: application/json' \
                --data "$body" \
                "$BASE_URL/api/agents/workflows/$WORKFLOW_ID/advance")
              if [[ "$http_code" != 200 && "$http_code" != 202 ]]; then
                echo "Stage $stage_index enqueue failed with HTTP $http_code:" >&2
                cat /tmp/kumplio-enqueue.json >&2
                exit 1
              fi
              echo "Stage $stage_index queued for durable execution."

              reached_review=false
              for poll in {1..120}; do
                sleep 15
                get_workflow
                stage_status=$(read_stage "$stage_index" status)
                if [[ "$stage_status" == pending_review || "$stage_status" == approved ]]; then
                  reached_review=true
                  break
                fi
                echo "Stage $stage_index status: $stage_status (poll $poll/120)."
              done
              if [[ "$reached_review" != true ]]; then
                echo "Stage $stage_index did not reach review within the polling window." >&2
                exit 1
              fi
            fi

            [[ "$stage_status" == approved ]] && continue
            run_id=$(read_stage "$stage_index" run_id)
            [[ -n "$run_id" ]] || { echo "Stage $stage_index has no run id." >&2; exit 1; }

            review_payload=$(STAGE_INDEX="$stage_index" node -e "process.stdout.write(JSON.stringify({decision:'approved',comment:'Aprobación E2E controlada de la etapa '+process.env.STAGE_INDEX+'; evidencia, limitaciones y respaldo revisados por el runner de validación.',checklist:{evidence_reviewed:true,limitations_understood:true,outcome_supported:true}}))")
            http_code=$(curl --silent --show-error \
              --output /tmp/kumplio-review.json \
              --write-out '%{http_code}' \
              --cookie /tmp/kumplio-e2e-cookies \
              -H 'Content-Type: application/json' \
              --data "$review_payload" \
              "$BASE_URL/api/agents/runs/$run_id/review")
            if [[ "$http_code" != 200 ]]; then
              echo "Stage $stage_index review failed with HTTP $http_code:" >&2
              cat /tmp/kumplio-review.json >&2
              exit 1
            fi
            STAGE_INDEX="$stage_index" TOTAL_STAGES="$TOTAL_STAGES" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/kumplio-review.json','utf8'));if(p.status!=='approved')process.exit(1);const isFinal=Number(process.env.STAGE_INDEX)===Number(process.env.TOTAL_STAGES)-1;if(isFinal&&p.outcomeSnapshot?.frozen!==true)throw new Error('Final approval did not return a frozen outcome snapshot');console.log('Stage '+process.env.STAGE_INDEX+' approved; workflow='+p.workflowStatus+', currentStage='+p.currentStage+'.')"
          done

      - name: Close and verify auditable case
        shell: bash
        run: |
          set -euo pipefail
          : "${WORKFLOW_ID:?WORKFLOW_ID not initialized}"
          : "${TOTAL_STAGES:?TOTAL_STAGES not initialized}"
          http_code=$(curl --silent --show-error \
            --output /tmp/kumplio-close.json \
            --write-out '%{http_code}' \
            --cookie /tmp/kumplio-e2e-cookies \
            -X POST "$BASE_URL/api/cases/$CASE_ID/close")
          [[ "$http_code" == 200 ]] || { echo "Case close failed with HTTP $http_code:" >&2; cat /tmp/kumplio-close.json >&2; exit 1; }

          curl --fail --silent --show-error \
            --cookie /tmp/kumplio-e2e-cookies \
            "$BASE_URL/api/agents/workflows/$WORKFLOW_ID" \
            > /tmp/kumplio-workflow-final.json
          TOTAL_STAGES="$TOTAL_STAGES" node <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('/tmp/kumplio-workflow-final.json', 'utf8'))
          const expectedStages = Number(process.env.TOTAL_STAGES)
          if (p.workflow?.status !== 'completed') throw new Error(`Workflow status is ${p.workflow?.status}`)
          if ((p.stages || []).length !== expectedStages || p.stages.some((stage) => stage.status !== 'approved')) throw new Error(`Not all ${expectedStages} stages are approved`)
          if (Number(p.workflow?.total_stages) !== expectedStages) throw new Error(`Workflow stage count changed from ${expectedStages} to ${p.workflow?.total_stages}`)
          const c = Array.isArray(p.workflow?.compliance_cases) ? p.workflow.compliance_cases[0] : p.workflow?.compliance_cases
          if (c?.status !== 'approved') throw new Error(`Case status is ${c?.status}`)
          if (p.outcomeSnapshot?.frozen !== true) throw new Error('Completed workflow is not backed by a frozen outcome snapshot')
          if (p.outcomeSnapshot?.contractVersion !== 'outcome-v2') throw new Error(`Unexpected outcome contract ${p.outcomeSnapshot?.contractVersion}`)
          if (p.outcome?.humanReviewStatus !== 'approved') throw new Error(`Frozen outcome review status is ${p.outcome?.humanReviewStatus}`)
          if (!p.outcomeQuality || typeof p.outcomeQuality.score !== 'number') throw new Error('Frozen outcome quality evaluation is missing')
          console.log(`Golden path complete: ${expectedStages}/${expectedStages} stages approved, workflow completed, case resolved, outcome snapshot frozen.`)
          NODE

      - name: Revoke E2E organization membership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${E2E_AUDIENCE}")
          cleanup_token=$(OIDC_RESPONSE="$response" node -e "const p=JSON.parse(process.env.OIDC_RESPONSE||'{}');if(!p.value)process.exit(1);process.stdout.write(p.value)")
          echo "::add-mask::$cleanup_token"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $cleanup_token" \
            -H "X-Kumplio-E2E: $E2E_MARKER" \
            -H 'Content-Type: application/json' \
            --data "{\"caseId\":\"$CASE_ID\"}" \
            "$BASE_URL/api/internal/e2e/revoke" > /tmp/kumplio-e2e-revoke.json
          echo 'E2E organization membership revoked.'

      - name: Publish golden path result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Golden path Ley 21.719 completed'
          else
            state=failure
            description="Golden path Ley 21.719 ${JOB_STATUS}"
          fi
          payload=$(STATE="$state" DESCRIPTION="$description" TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" CONTEXT="$STATUS_CONTEXT" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL,context:process.env.CONTEXT}))")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
