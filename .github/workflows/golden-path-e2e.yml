name: Golden path Ley 21.719 E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/golden-path-e2e.yml'
      - 'app/api/internal/e2e/**'
      - 'lib/security/github-actions-oidc.ts'
      - 'app/api/agents/workflows/**'
      - 'app/api/agents/runs/**'
      - 'lib/agents/workflow-stage-executor.ts'
      - 'scripts/53-advance-workflow-after-approval.sql'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: read

concurrency:
  group: golden-path-e2e-production
  cancel-in-progress: false

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_URL: https://kumplio.app
      CASE_ID: 91ae9174-be4c-4ddd-8980-4a671571afdc
      WORKFLOW_ID: dcd5d171-ce3d-4425-9b17-83d48bfbae71
      E2E_AUDIENCE: kumplio-golden-path-e2e
      E2E_MARKER: block02-golden-path
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            verdict=$(PAYLOAD="$payload" node -e "const d=JSON.parse(process.env.PAYLOAD||'{}');const w=['Vercel – kumplio','Vercel – v0-normative-compliance-analysis'];const m=new Map();for(const s of d.statuses||[]){if(w.includes(s.context)&&!m.has(s.context))m.set(s.context,s.state)};process.stdout.write(w.every(n=>m.get(n)==='success')?'success':[...m.values()].some(s=>s==='failure'||s==='error')?'failure':'pending')")
            [[ "$verdict" == success ]] && { echo 'Production Vercel deployments are green.'; exit 0; }
            [[ "$verdict" == failure ]] && { echo 'A production Vercel deployment failed.' >&2; exit 1; }
            sleep 10
          done
          echo 'Timed out waiting for production Vercel deployments.' >&2
          exit 1

      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${E2E_AUDIENCE}")
          OIDC_RESPONSE="$response" node -e "const p=JSON.parse(process.env.OIDC_RESPONSE||'{}');if(!p.value)process.exit(1);process.stdout.write(p.value)" > /tmp/kumplio-e2e-oidc
          chmod 600 /tmp/kumplio-e2e-oidc
          echo "::add-mask::$(cat /tmp/kumplio-e2e-oidc)"

      - name: Create temporary authenticated E2E session
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/kumplio-e2e-oidc)
          curl --fail --silent --show-error \
            --cookie-jar /tmp/kumplio-e2e-cookies \
            -H "Authorization: Bearer $token" \
            -H "X-Kumplio-E2E: $E2E_MARKER" \
            -H 'Content-Type: application/json' \
            --data "{\"caseId\":\"$CASE_ID\"}" \
            "$BASE_URL/api/internal/e2e/session" > /tmp/kumplio-e2e-session.json
          chmod 600 /tmp/kumplio-e2e-cookies
          SESSION_JSON=$(cat /tmp/kumplio-e2e-session.json) node -e "const p=JSON.parse(process.env.SESSION_JSON||'{}');if(!p.ok||!p.serviceUserId)process.exit(1);console.log('Temporary E2E session created.')"

      - name: Execute and approve durable specialist stages
        shell: bash
        run: |
          set -euo pipefail

          get_workflow() {
            curl --fail --silent --show-error --cookie /tmp/kumplio-e2e-cookies "$BASE_URL/api/agents/workflows/$WORKFLOW_ID"
          }

          read_stage() {
            STATE="$1" STAGE_INDEX="$2" FIELD="$3" node -e "const p=JSON.parse(process.env.STATE||'{}');const s=(p.stages||[]).find(x=>x.stage_index===Number(process.env.STAGE_INDEX));if(!s)process.exit(2);const v=s[process.env.FIELD];if(v!==null&&v!==undefined)process.stdout.write(String(v))"
          }

          for stage_index in 0 1 2 3 4; do
            state=$(get_workflow)
            stage_status=$(read_stage "$state" "$stage_index" status)

            if [[ "$stage_status" == approved ]]; then
              echo "Stage $stage_index already approved."
              continue
            fi

            if [[ "$stage_status" != pending_review ]]; then
              body='{}'
              [[ "$stage_status" == changes_requested ]] && body='{"instructions":"Reintento E2E controlado: corrige únicamente las observaciones registradas y conserva trazabilidad."}'
              http_code=$(curl --silent --show-error \
                --output /tmp/kumplio-enqueue.json \
                --write-out '%{http_code}' \
                --cookie /tmp/kumplio-e2e-cookies \
                -H 'Content-Type: application/json' \
                --data "$body" \
                "$BASE_URL/api/agents/workflows/$WORKFLOW_ID/advance")
              if [[ "$http_code" != 200 && "$http_code" != 202 ]]; then
                echo "Stage $stage_index enqueue failed with HTTP $http_code:" >&2
                cat /tmp/kumplio-enqueue.json >&2
                exit 1
              fi
              echo "Stage $stage_index queued for durable execution."

              reached_review=false
              for poll in {1..120}; do
                sleep 15
                state=$(get_workflow)
                stage_status=$(read_stage "$state" "$stage_index" status)
                if [[ "$stage_status" == pending_review || "$stage_status" == approved ]]; then
                  reached_review=true
                  break
                fi
                echo "Stage $stage_index status: $stage_status (poll $poll/120)."
              done
              if [[ "$reached_review" != true ]]; then
                echo "Stage $stage_index did not reach review within the polling window." >&2
                exit 1
              fi
            fi

            [[ "$stage_status" == approved ]] && continue
            run_id=$(read_stage "$state" "$stage_index" run_id)
            [[ -n "$run_id" ]] || { echo "Stage $stage_index has no run id." >&2; exit 1; }

            review_payload=$(STAGE_INDEX="$stage_index" node -e "process.stdout.write(JSON.stringify({decision:'approved',comment:'Aprobación E2E controlada de la etapa '+process.env.STAGE_INDEX+'; evidencia, limitaciones y respaldo revisados por el runner de validación.',checklist:{evidence_reviewed:true,limitations_understood:true,outcome_supported:true}}))")
            http_code=$(curl --silent --show-error \
              --output /tmp/kumplio-review.json \
              --write-out '%{http_code}' \
              --cookie /tmp/kumplio-e2e-cookies \
              -H 'Content-Type: application/json' \
              --data "$review_payload" \
              "$BASE_URL/api/agents/runs/$run_id/review")
            if [[ "$http_code" != 200 ]]; then
              echo "Stage $stage_index review failed with HTTP $http_code:" >&2
              cat /tmp/kumplio-review.json >&2
              exit 1
            fi
            REVIEW_JSON=$(cat /tmp/kumplio-review.json) STAGE_INDEX="$stage_index" node -e "const p=JSON.parse(process.env.REVIEW_JSON||'{}');if(p.status!=='approved')process.exit(1);console.log('Stage '+process.env.STAGE_INDEX+' approved; workflow='+p.workflowStatus+', currentStage='+p.currentStage+'.')"
          done

      - name: Close and verify auditable case
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error \
            --output /tmp/kumplio-close.json \
            --write-out '%{http_code}' \
            --cookie /tmp/kumplio-e2e-cookies \
            -X POST "$BASE_URL/api/cases/$CASE_ID/close")
          [[ "$http_code" == 200 ]] || { echo "Case close failed with HTTP $http_code:" >&2; cat /tmp/kumplio-close.json >&2; exit 1; }

          state=$(curl --fail --silent --show-error --cookie /tmp/kumplio-e2e-cookies "$BASE_URL/api/agents/workflows/$WORKFLOW_ID")
          STATE="$state" node <<'NODE'
          const p = JSON.parse(process.env.STATE || '{}')
          if (p.workflow?.status !== 'completed') throw new Error(`Workflow status is ${p.workflow?.status}`)
          if ((p.stages || []).length !== 5 || p.stages.some((stage) => stage.status !== 'approved')) throw new Error('Not all five stages are approved')
          const c = Array.isArray(p.workflow?.compliance_cases) ? p.workflow.compliance_cases[0] : p.workflow?.compliance_cases
          if (c?.status !== 'approved') throw new Error(`Case status is ${c?.status}`)
          console.log('Golden path complete: 5/5 stages approved, workflow completed, case resolved.')
          NODE

      - name: Revoke E2E organization membership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${E2E_AUDIENCE}")
          cleanup_token=$(OIDC_RESPONSE="$response" node -e "const p=JSON.parse(process.env.OIDC_RESPONSE||'{}');if(!p.value)process.exit(1);process.stdout.write(p.value)")
          echo "::add-mask::$cleanup_token"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $cleanup_token" \
            -H "X-Kumplio-E2E: $E2E_MARKER" \
            -H 'Content-Type: application/json' \
            --data "{\"caseId\":\"$CASE_ID\"}" \
            "$BASE_URL/api/internal/e2e/revoke" > /tmp/kumplio-e2e-revoke.json
          echo 'E2E organization membership revoked.'
